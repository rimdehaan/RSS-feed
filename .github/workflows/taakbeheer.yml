# Testen en uitrollen van Taakbeheer.
#
# Wat er gebeurt bij elke push:
#   1. De tests draaien. Zakken die, dan stopt alles hier.
#   2. Vanaf de hoofdbranch gaat het daarna naar Railway. Werk je op een andere
#      branch, dan draaien alleen de tests.
#
# Er kunnen twee servers uitrollen vanaf dezelfde code: de zakelijke en de
# privé-versie. Ze delen alles behalve hun database, en de tests zijn voor
# allebei de poortwachter. De privé-versie slaat hij over zolang de variabele
# RAILWAY_SERVICE_PRIVE leeg is.
#
# Handmatig uitrollen kan ook: tabblad Actions op GitHub, klik links op
# "Taakbeheer", dan rechts op "Run workflow".
#
# Instellen: zie taakbeheer/HOSTING.md

name: Taakbeheer

on:
  push:
    paths:
      - 'taakbeheer/**'
      - '.github/workflows/taakbeheer.yml'
  pull_request:
    paths:
      - 'taakbeheer/**'
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taakbeheer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taakbeheer/package-lock.json

      - name: Pakketten installeren
        run: npm ci

      - name: Tests draaien
        run: npm test

  deploy:
    name: Uitrollen naar Railway
    needs: test
    # Alleen vanaf de hoofdbranch van de repo — hoe die ook heet — of wanneer je
    # het zelf start vanuit het Actions-tabblad.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Blijft Railway hangen, dan stopt deze stap vanzelf in plaats van eindeloos
    # door te draaien.
    timeout-minutes: 20
    concurrency:
      # Nooit twee keer tegelijk uitrollen.
      group: taakbeheer-deploy
      cancel-in-progress: false

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE: ${{ vars.RAILWAY_SERVICE || 'taakbeheer' }}
      # De privé-server. Laat je hem leeg, dan wordt er alleen zakelijk
      # uitgerold en verandert er niets aan hoe het hiervoor ging.
      SERVICE_PRIVE: ${{ vars.RAILWAY_SERVICE_PRIVE }}

    steps:
      - name: Kijken of het token er is
        id: controle
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "klaar=ja" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=nee" >> "$GITHUB_OUTPUT"
            echo "::warning::Geen RAILWAY_TOKEN ingesteld, dus er wordt niet uitgerold. Zie taakbeheer/HOSTING.md om die aan te maken."
          fi

      - uses: actions/checkout@v4
        if: steps.controle.outputs.klaar == 'ja'

      - uses: actions/setup-node@v4
        if: steps.controle.outputs.klaar == 'ja'
        with:
          node-version: '22'

      - name: Railway-CLI installeren
        if: steps.controle.outputs.klaar == 'ja'
        run: npm install -g @railway/cli@5

      # Bewust zonder --detach: zo wacht deze stap op het bouwen en wordt hij rood
      # als de uitrol mislukt. Met --detach was hij meteen groen, ook als Railway
      # daarna vastliep — en dan denk je dat het goed ging terwijl dat niet zo is.
      #
      # De zakelijke server gaat eerst. Struikelt die, dan stopt het hier en
      # blijft de privé-server op de vorige versie staan — beter dan andersom.
      - name: Uitrollen
        if: steps.controle.outputs.klaar == 'ja'
        working-directory: taakbeheer
        run: |
          for dienst in "$SERVICE" "$SERVICE_PRIVE"; do
            [ -n "$dienst" ] || continue
            echo "::group::Uitrollen naar $dienst"
            railway up --service "$dienst"
            echo "::endgroup::"
          done

      - name: Klaar
        if: steps.controle.outputs.klaar == 'ja'
        run: |
          {
            echo "### Uitgerold naar Railway :rocket:"
            echo ""
            echo "Server: \`$SERVICE\`"
            if [ -n "$SERVICE_PRIVE" ]; then
              echo "Server: \`$SERVICE_PRIVE\` (privé)"
            else
              echo "_De privé-server staat uit: de variabele \`RAILWAY_SERVICE_PRIVE\` is leeg._"
            fi
            echo "Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "Het bouwen loopt verder op Railway. Volg het daar onder **Deploy Logs**."
          } >> "$GITHUB_STEP_SUMMARY"
