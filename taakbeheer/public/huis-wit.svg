<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Huis">
  <!-- Dezelfde vorm en dezelfde coördinaten als huis-kleur.svg, in één kleur
       voor de gekleurde zijbalk. Ook hier de spiegeling: glas rechts.

       Let op de kieren. In de kleurversie steekt het donkere dak af tegen het
       lichte glas; hier is allebei wit, en dan versmelt het tot één vlek die
       op een tent lijkt. Daarom liggen de daklijn en de grondlijn los.

       De roeden zijn zwart met een lage dekking, niet de kleur van de zijbalk.
       Zo werkt dit ene bestand op elke donkere achtergrond — blauw op het werk,
       terracotta thuis — zonder dat er een derde versie bij moet. -->
  <g transform="translate(48,0) scale(-1,1)">
    <path d="M28.4 40.2 V18.6 L43 20.8 V40.2 Z" fill="#fff" fill-opacity=".38"/>
    <path d="M12.4 40.2 L6 15.1 L27 17 V40.2 Z" fill="#fff" fill-opacity=".9"/>

    <g stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-opacity=".42">
      <path d="M9 28.4 H27"/>
      <path d="M16.6 16.2 L18.8 40.2"/>
    </g>

    <g fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.2 12.4 L27 14.6 L44 19.1"/>
      <path d="M5.4 43 H44"/>
    </g>
  </g>
</svg>
