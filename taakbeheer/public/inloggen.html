<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inloggen — Transafe Taakbeheer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23002944'/%3E%3Cg fill='%235B869F'%3E%3Crect x='7' y='7' width='7' height='7' rx='1.5'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1.5'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1.5'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1.5' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/stijl.css" />
</head>
<body>
  <div class="inlog-scherm">
    <div class="inlog-kaart">
      <div class="inlog-logo"><img src="/logo-kleur.svg" alt="Transafe" /></div>
      <h1 id="titel">Inloggen</h1>

      <form id="formulier">
        <div class="veld" id="naamVeld" hidden>
          <label for="naam">Naam</label>
          <input type="text" id="naam" autocomplete="name" />
        </div>
        <div class="veld" id="emailVeld">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" autocomplete="username" required />
        </div>
        <div class="veld">
          <label for="wachtwoord">Wachtwoord</label>
          <input type="password" id="wachtwoord" autocomplete="current-password" required />
        </div>
        <!-- Alleen als je een nieuw wachtwoord kiest. Bewust geen `required`:
             een verborgen verplicht veld blokkeert het versturen. -->
        <div class="veld" id="herhaalVeld" hidden>
          <label for="herhaal">Herhaal Wachtwoord</label>
          <input type="password" id="herhaal" autocomplete="new-password" />
        </div>
        <div class="melding" id="melding"></div>
        <button type="submit" class="btn btn-primary" id="verstuur">Inloggen</button>
      </form>

      <p class="inlog-uitleg" id="uitleg">
        Nog geen account? Een beheerder van Transafe kan je uitnodigen.
      </p>
    </div>
  </div>

  <script src="/inloggen.js"></script>
</body>
</html>
